name: Generate Random Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - Main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        run: |
          mkdir -p dist

          python3 <<'PY'
          import random
          import datetime

          COLS = 52
          ROWS = 7
          FILL = 0.55

          START_DATE = datetime.date(2026, 7, 12)
          TODAY = datetime.date.today()

          random.seed(int(TODAY.strftime("%Y%m%d")))

          COLORS = [
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353"
          ]

          EMPTY = "#161b22"

          def make_svg():
              w = COLS * 18
              h = ROWS * 18

              svg = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{w}" height="{h}" viewBox="0 0 {w} {h}">',
                  '<rect width="100%" height="100%" fill="#0d1117"/>'
              ]

              # Grid
              for col in range(COLS):
                  for row in range(ROWS):

                      date = (
                          TODAY
                          - datetime.timedelta(days=TODAY.weekday() + 1)
                          - datetime.timedelta(weeks=COLS - col - 1)
                          + datetime.timedelta(days=row)
                      )

                      x = col * 18 + 2
                      y = row * 18 + 2

                      if START_DATE <= date <= TODAY and random.random() < FILL:
                          color = random.choice(COLORS)
                      else:
                          color = EMPTY

                      svg.append(
                          f'<rect x="{x}" y="{y}" width="14" height="14" '
                          f'rx="3" fill="{color}"/>'
                      )

              # Snake path
              points = []

              for row in range(ROWS):
                  cols = range(COLS) if row % 2 == 0 else range(COLS - 1, -1, -1)

                  for col in cols:
                      points.append((col * 18 + 9, row * 18 + 9))

              path = f"M {points[0][0]} {points[0][1]}"

              for x, y in points[1:]:
                  path += f" L {x} {y}"

              svg.append(
                  f'<path id="snake" d="{path}" fill="none" stroke="none"/>'
              )

              # Snake
              for i in range(5):
                  svg.append(f'''
                  <rect width="11" height="11"
                        rx="3"
                        fill="#bc13fe"
                        opacity="{1 - i * 0.12}">
                    <animateMotion
                      dur="12s"
                      begin="{-i * 0.18}s"
                      repeatCount="indefinite"
                      rotate="auto">
                      <mpath href="#snake"/>
                    </animateMotion>
                  </rect>
                  ''')

              svg.append("</svg>")

              return "\n".join(svg)

          with open(
              "dist/github-contribution-grid-snake.svg",
              "w"
          ) as f:
              f.write(make_svg())

          with open(
              "dist/github-contribution-grid-snake-dark.svg",
              "w"
          ) as f:
              f.write(make_svg())

          print("Snake generated!")

          PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
